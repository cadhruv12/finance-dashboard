<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Finance Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: Segoe UI, sans-serif; margin: 0; background: #f7f7f7; }
        .tabs { display: flex; background: #fff; border-bottom: 1px solid #ddd; }
        .tab-btn {
            padding: 14px 22px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 15px;
        }
        .tab-btn.active { border-bottom: 3px solid #4F81BD; font-weight: 600; }

        .container { padding: 20px; }

        .filters { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .filters select { padding: 6px 10px; font-size: 14px; }

        .kpi-boxes { display: flex; gap: 20px; margin-bottom: 20px; }
        .kpi {
            background: #fff;
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex: 1;
        }
        .kpi-title { font-size: 13px; color: #666; margin-bottom: 6px; }
        .kpi-value { font-size: 20px; font-weight: 600; }

        #salesChart, #plChart, #plCompareChart {
            width: 100%; height: 380px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        th { background: #fafafa; text-align: left; }

        #salesDrillPanel {
            margin-top: 20px;
            display: none;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
    </style>
</head>

<body onload="init()">

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="sales">Sales</button>
        <button class="tab-btn" data-tab="pl">P&L</button>
        <button class="tab-btn" data-tab="plCompare">P&L Comparison</button>
    </div>

    <!-- SALES VIEW -->
    <div id="salesView" class="container">

        <!-- Filters -->
        <div class="filters">
            <select id="companyFilter"></select>
            <select id="divisionFilter"></select>
            <select id="yearFilter"></select>
            <select id="monthFilter"></select>
            <select id="brandFilter"></select>
            <select id="customerFilter"></select>
            <select id="salesmanFilter"></select>
            <button id="resetBtn">Reset</button>

            <input type="color" id="colorPicker" value="#4F81BD" style="margin-left:auto;">
        </div>

        <!-- KPIs -->
        <div class="kpi-boxes">
            <div class="kpi">
                <div class="kpi-title">Total Sales</div>
                <div class="kpi-value" id="kpiTotal">0K</div>
            </div>
            <div class="kpi">
                <div class="kpi-title">Periods</div>
                <div class="kpi-value" id="kpiPeriods">0</div>
            </div>
        </div>

        <!-- Main Chart -->
        <canvas id="salesChart"></canvas>

        <!-- Drill Panel -->
        <div id="salesDrillPanel">
            <h3 id="salesDrillTitle"></h3>
            <div class="two-col">
                <canvas id="brandChart"></canvas>
                <canvas id="custChart"></canvas>
            </div>
        </div>
    </div>

    <!-- P&L VIEW -->
    <div id="plView" class="container" style="display:none;">

        <div class="filters">
            <select id="plCompanyFilter"></select>
            <select id="plYearFilter"></select>
            <select id="plMonthFilter"></select>
            <button id="plResetBtn">Reset</button>
        </div>

        <div class="kpi-boxes">
            <div class="kpi">
                <div class="kpi-title">Revenue</div>
                <div class="kpi-value" id="plKpiRevenue">0K</div>
            </div>
            <div class="kpi">
                <div class="kpi-title">Gross Profit</div>
                <div class="kpi-value" id="plKpiGP">0K (0%)</div>
            </div>
            <div class="kpi">
                <div class="kpi-title">Net Profit</div>
                <div class="kpi-value" id="plKpiNP">0K (0%)</div>
            </div>
            <div class="kpi">
                <div class="kpi-title">OPEX</div>
                <div class="kpi-value" id="plKpiOpex">0K</div>
            </div>
        </div>

        <canvas id="plChart"></canvas>

        <table>
            <thead>
                <tr>
                    <th>Category</th>
                    <th style="text-align:right;">Amount</th>
                    <th style="text-align:right;">%</th>
                </tr>
            </thead>
            <tbody id="plTableBody"></tbody>
        </table>
    </div>

    <!-- P&L COMPARISON VIEW -->
    <div id="plCompareView" class="container" style="display:none;">

        <div class="filters">
            <select id="plCompCompany1"></select>
            <select id="plCompYear1"></select>
            <select id="plCompMonth1"></select>

            <select id="plCompCompany2"></select>
            <select id="plCompYear2"></select>
            <select id="plCompMonth2"></select>

            <button id="plCompResetBtn">Reset</button>
        </div>

        <div class="two-col">
            <div class="kpi">
                <div class="kpi-title">Revenue (Left)</div>
                <div class="kpi-value" id="plCompRev1">0K</div>
            </div>
            <div class="kpi">
                <div class="kpi-title">Revenue (Right)</div>
                <div class="kpi-value" id="plCompRev2">0K</div>
            </div>

            <div class="kpi">
                <div class="kpi-title">Gross Profit (Left)</div>
                <div class="kpi-value" id="plCompGP1">0K (0%)</div>
            </div>
            <div class="kpi">
                <div class="kpi-title">Gross Profit (Right)</div>
                <div class="kpi-value" id="plCompGP2">0K (0%)</div>
            </div>

            <div class="kpi">
                <div class="kpi-title">Net Profit (Left)</div>
                <div class="kpi-value" id="plCompNP1">0K (0%)</div>
            </div>
            <div class="kpi">
                <div class="kpi-title">Net Profit (Right)</div>
                <div class="kpi-value" id="plCompNP2">0K (0%)</div>
            </div>
        </div>

        <canvas id="plCompareChart"></canvas>

        <table>
            <thead>
                <tr>
                    <th>Category</th>
                    <th style="text-align:right;">Left Amount</th>
                    <th style="text-align:right;">Left %</th>
                    <th style="text-align:right;">Right Amount</th>
                    <th style="text-align:right;">Right %</th>
                </tr>
            </thead>
            <tbody id="plCompareTableBody"></tbody>
        </table>
    </div>

    <!-- JS -->
    <script src="dashboard-app.js"></script>

</body>
</html>
